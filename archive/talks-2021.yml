- date: '2021-02-15'
  speaker: Petr Ambrož
  speaker_url: https://kmlinux.fjfi.cvut.cz/~ambrop1/?loc=contacts&lg=en
  title: Morphisms generating antipalindromic words
  video: https://youtu.be/eL8-2DYBEzU
  abstract: |
    We introduce two classes of morphisms over the alphabet
    $A=\{0,1\}$ whose fixed
    points contain infinitely many antipalindromic factors. An
    antipalindrome is a finite word invariant
    under the action of the antimorphism $E:\{0,1\}^*\to\{0,1\}^*$, defined
    by $E(w_1\cdots w_n)=(1-w_n)\cdots(1-w_1)$.
    We conjecture that these two classes contain all morphisms (up to
    conjugation) which generate infinite words with
    infinitely many antipalindromes. This is an analogue to the famous HKS
    conjecture concerning infinite words
    containing infinitely many palindromes. We prove our conjecture for two
    special classes of morphisms,
    namely (i) uniform morphisms and (ii) morphisms with fixed points
    containing also infinitely many palindromes.

- date: '2021-02-08'
  speaker: Robert Mercas
  speaker_url: http://robertmercas.com/
  title: (Trying to do a) Counting of distinct repetitions in words
  video: https://youtu.be/SxVNuHk-vEc
  abstract: |
    The
    topic of counting the distinct repetitions that a word contains has been around for at least two decades. The problem of counting distinct squares in a word was introduced by Fraenkel and Simpson in ’98, who also showed that their number is upper bounded by twice the length of the word. However, their conjecture that the factor of 2 is superfluous (the length of the word is a strict bound) is still open (though there exist several improvements of their original result). Moreover, recently Manea and Seki showed that proving the bound for binary words is enough. Moreover, further work was done on counting distinct repetitions of higher exponent with quite sharp bounds.
    By looking at non-extendable repetitions of power at least two (thus considering fractional ones as well) Kolpakov and Kucherov tried to bound in ‘99 the number of runs in a word (non-necessarily distinct). This was recently shown to be less than the length $n$ of the word that we consider and more than 0.9482 times $n$.
    However, all of these ideas have a common sticking point, namely the three squares lemma of Crochemore and Rytter, which they all use as main tool. In this talk I will present a different technique (which so far is not fully exploited) of trying to count distinct squares and show some surprising connections between all of the above notions.

- date: '2021-02-01'
  speaker: Jean-Paul Allouche
  speaker_url: https://webusers.imj-prg.fr/~jean-paul.allouche/
  title: Hidden automatic sequences
  video: https://youtu.be/NWE0t9lji5c
  abstract: |
    We discuss a joint work with Michel Dekking and Martine Queffélec
    (https://arxiv.org/abs/2010.00920) about sequences given as
    fixed points of non-uniform morphisms that happen to be actually
    automatic.

    One of the most ancien example is probably the one due to Berstel,
    who proved that the Istrail squarefree sequence defined as the fixed
    point of the morphism $f$ with $f(0) = 12$, $f(1) = 102$, $f(2) = 0$ is also
    $2$-automatic.

    After revisiting an old criterion due to M. Dekking at the end of the 70's,
    we give several examples (in particular of sequences in the OEIS).
    Finally we focus on morphisms associated with Grigorchuk(-like) groups.

- date: '2021-01-04'
  speaker: Anna Frid
  speaker_url: http://www.i2m.univ-amu.fr/perso/anna.frid/
  title: Is *not* prefix palindromic length of a $k$-automatic word $k$-regular?
  video: https://youtu.be/a4f7ITNzQHA
  abstract: |
    We consider the function of the prefix palindromic length for $k$-automatic words and prove that it is $k$-regular for such words containing a finite number of distinct palindromes, like for example the paperfolding word. We also observe that in the opposite case, if the number of distinct palindromes is infinite, this function can be $k$-regular, as for the Thue-Morse word, or seemingly not, as for the period-doubling word. The fact of non-regularity, however, stays unproven.

    This is a joint work with Enzo Laborde and Jarkko Peltomäki. The preprint is available at https://arxiv.org/abs/2009.02934.
