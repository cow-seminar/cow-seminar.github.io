- date: '2021-03-22'
  time: '16:00'
  speaker: Francesco Dolce
  title: On morphisms preserving palindromic richness
  video: https://youtu.be/iDC9YchkgQk
  abstract: |
    A finite word is said to be rich if it has maximal number of palindromic factors (this is known to be the length of the word plus one). This definition can be naturally extended to infinite words.Sturmian words and Rote complementary symmetric sequences form two classes of binary rich words, while strict episturmian words and words coding symmetric interval exchange transformations give us other examples on larger alphabets.
    In this talk we study homomorphisms of the free monoid which allow to construct new rich words from already known rich words. In particular, we focus on two types of morphisms: Arnoux-Rauzy morphisms and morphisms from Class $P_{ret}$. These morphisms contain Sturmian morphisms as a subclass. We show that Arnoux-Rauzy morphisms preserve the set of all rich words.
    We also characterize $P_{ret}$ morphisms which preserve richness on binary alphabet.
    This is a joint work with Edita Pelantová.

- date: '2021-03-22'
  time: '15:30'
  speaker: Ibai Aedo
  title: On long arithmetic progressions in binary Morse-like words
  video: https://youtu.be/rARzCXHU_20
  abstract: |
    In this talk, I will present a joint work with Uwe Grimm, Yasushi Nagai and Petra Staynova based on a recent preprint: arXiv:2101.02056. Regarding the Prouhet-Thue-Morse word as a two-colouring of the positive integers, we look for long monochromatic arithmetic progressions occurring in the sequence.

    The size of the longest arithmetic progression of difference $d=2^n-1$ was previously established by O. Parshina. Using a different approach, mainly based on exploiting the substitution structure of the Prouhet-Thue-Morse word, we will show how we can re-establish this result and find another series of long arithmetic progressions of difference d=2^n+1. Then, we will comment on a generalisation of these results for a special class of bijective binary words, and we will finish with some more general results and some open questions.

- date: '2021-03-22'
  time: '15:00'
  speaker: Jane D. Palacio
  title: Coverable bi-infinite substitution shifts
  video: https://youtu.be/WnSPgzYb4rY
  abstract: |
    A finite or infinite word $w$ is said to be coverable if it can be formed by
    overlapping or adjacent occurrences of some finite subword $u$ of $w$. Coverability of finite words was introduced by A. Apostolico and A. Ehrenfeucht in the
    context of text algorithms in 1993. In 2004, S. Marcus extended the concept
    of coverability to (one-sided) infinite sequences. In this presentation, we will
    define the notion of coverable bi-infinite shifts.

    In general, coverability of subshifts is not topologically invariant. Nevertheless, we show that a special type of coverability of substitutive shifts is invariant under topological conjugacy. To better understand coverability of
    bi-infinite shifts, we aim to identify properties of substitutions that ensure
    coverability or non-coverability of its associated shifts.

    This is joint work with Manuel Joseph Loquias and Eden Delight Miro.

- date: '2021-03-15'
  speaker: Szymon Stankiewicz
  speaker_url: https://scholar.google.com/citations?user=4N1aV1UAAAAJ&hl=fr&oi=ao
  title: Square-free reducts of words
  video: https://youtu.be/JFxZ8rzRw1M
  abstract: |
    We discuss a joint work with Jarosław Grytczuk (https://arxiv.org/abs/2011.12822) about square-free reducts of words.

    In any finite word one may delete the repeated block of a square, obtaining thereby a shorter word. By repeating this process, a square-free word is eventually reached, which we call a reduct of the original word.

    We will show that for each positive integer $n$ there is a word over ternary alphabet which can be reduced to at least $n$ different words and also that there is a word over alphabet of size four which has exactly $n$ reducts. We will also show that there exists infinitely many ternary words having exponential many reducts in the length of these words.

    For a fixed alphabet one can create a poset with nodes being words and $u > v$ iff word $u$ can be reduced to word $v$. We will describe some properties of those posets.

- date: '2021-03-01'
  speaker: Mickaël Postic
  speaker_url: http://math.univ-lyon1.fr/homes-www/postic/
  title: Open and closed complexity functions of infinite words
  video: https://youtu.be/k3WmdTRIs84
  abstract: |
    Closed words, also known as complete first returns, have been studied for a long time, and play an important role in symbolic dynamics. A word which is not closed is said to be open. In this talk based on a joint work with Olga Parshina, I will present a characterization of aperiodic words in terms of their open complexity function and closed complexity function, in the spirit of Morse and Hedlund's theorem. The preprint is available at https://arxiv.org/pdf/2005.06254.pdf

- date: '2021-02-22'
  time: '17:30'
  speaker: Mélodie Andrieu
  speaker_url: http://www.i2m.univ-amu.fr/perso/andrieu-es.m/index.html
  title: A Rauzy fractal unbounded in all directions of the plane
  abstract: |
    Until 2001 it was believed that, as for Sturmian words, the imbalance of Arnoux-Rauzy words was bounded - or at least finite.  Cassaigne, Ferenczi and Zamboni disproved this conjecture by constructing an Arnoux-Rauzy word with infinite imbalance, i.e. a word whose broken line deviates regularly and further and further from its average direction.
    Today, we hardly know anything about the geometrical and topological properties of these unbalanced Rauzy fractals. The Oseledets theorem suggests that these fractals are contained in a strip of the plane: indeed, if the Lyapunov exponents of the matricial product associated with the word exist, one of these exponents at least is nonpositive since their sum equals zero.
    The study of the pairs of abelianized factors of Arnoux-Rauzy words disproves this belief.

- date: '2021-02-22'
  time: '17:00'
  speaker: Florin Manea
  speaker_url: http://flmanea.blogspot.com/
  title: Efficiently Testing Simon's Congruence
  video: https://youtu.be/7mQy6mLWll8
  abstract: |
    [full text](https://arxiv.org/abs/2005.01112)

    Simon's congruence $\sim_k$ is a relation on words defined by Imre Simon in the 1970s and intensely studied since then. This congruence was initially used in connection to piecewise testable languages, but also found many applications in, e.g., learning theory, databases theory, or linguistics. The $\sim_k$-relation is defined as follows: two words are $\sim_k$-congruent if they have the same set of subsequences of length at most $k$. A long standing open problem, stated already by Simon in his initial works on this topic, was to design an algorithm which computes, given two words $s$ and $t$, the largest $k$ for which $s\sim_k t$. We propose the first algorithm solving this problem in linear time $O(|s|+|t|)$ when the input words are over the integer alphabet $\{1,\ldots,|s|+|t|\}$ (or other alphabets which can be sorted in linear time). Our approach can be extended to an optimal algorithm in the case of general alphabets as well.

    To achieve these results, we introduce a novel data-structure, called Simon-Tree, which allows us to construct a natural representation of the equivalence classes induced by $\sim_k$ on the set of suffixes of a word, for all $k\geq 1$. We show that such a tree can be constructed for an input word in linear time. Then, when working with two words $s$ and $t$, we compute their respective Simon-Trees and efficiently build a correspondence between the nodes of these trees. This correspondence, which can also be constructed in linear time $O(|s|+|t|)$, allows us to retrieve the largest $k$ for which $s\sim_k t$.

