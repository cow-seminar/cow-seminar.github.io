- date: 2026-11-24
  speaker: Thierry de la Rue
  speaker_url: https://delarue.perso.math.cnrs.fr/
  title: Frequency of patterns in smooth sequences over the alphabet $\{1,3\}$
  abstract: |
    The famous Oldenburger-Kolakoski sequence is an example of a smooth sequence over $\{1,2\}$, that is a sequence on which we can iterate the run-length encoding operation while sticking to the same alphabet. The very existence of the frequency of “$1$”s in this sequence has been the subject of an open question for decades.

    In this talk, based on a joint work with Damien Jamet, Irène Marcovici and Léo Poirier, I will show that smooth sequences over the alphabet $\{1,3\}$ are much easier to analyze. Indeed these sequences hide a substitutive structure that we use to demonstrate the following result: The subshift of smooth sequences over $\{1,3\}$ is partitioned into continuously many uniquely ergodic subshifts. As a consequence, the asymptotic frequency of any finite pattern in a given smooth sequence over $\{1,3\}$ is always well-defined and depends only on its so-called “type sequence“. I will also discuss the minimality of these subshifts.

- date: 2026-12-08
  speaker: Christian B. Hughes
  speaker_url: https://christianbhughes.com/
  title: Clustering of Return Words in the Languages of Arbitrary Standard IETs
  abstract: |
    Interval exchange transformations (IETs) are dynamical systems that rearrange finitely many sub-intervals of an interval; their symbolic codings admit languages with rich combinatorial properties. We study return words in IET languages and their connection to the Burrows-Wheeler transform, a word transform often employed in text pre-compression, and show, via stepwise morphisms attached to an extended induction on IETs, that every return word in the language of an arbitrary standard IET is clustering with respect to the IET's defining permutation, in turn answering a question of Mélodie Lapointe.

- date: 2026-12-22
  speaker: Jeffrey O. Shallit
  speaker_url: https://cs.uwaterloo.ca/~shallit/
  title: LLM's and Combinatorics on Words
  abstract: |
    This talk will consist of three parts. In the first part, I'll briefly survey some new results that I and my co-authors have obtained this year by using various LLM's. You can see some of them on my page https://cs.uwaterloo.ca/~shallit/papers.html where an asterisk at the start of an entry means we used an LLM to obtain some or all of the results.

    In the second part, I'll mention a list of issues that this new, powerful technology raises for mathematics in general, and combinatorics on words in particular.

    In the third part, I'll throw it open to an open-ended audience discussion of the issues, so if you have been following what's going on, please think in advance about questions and issues you might want to discuss.

