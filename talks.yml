- date: 2026-10-13
  speaker: Vanessa Kosoy
  speaker_url: https://coral-research.org/vanessa-kosoy/
  title: Stringological sequence prediction
  video: https://youtu.be/C3KM9uYwJqg
  abstract: |
    This talk is about a newly discovered connection between combinatorics on words and the sequence prediction problem in machine learning. The sequence prediction problem asks to provide an algorithm which, given the prefix of a word, guesses the next symbol in some “intelligent” way. The natural interpretation of “intelligent” is to require that on “simple” words – i.e. words that have simple patterns – the algorithm makes few mistakes. Formally, it means that we specify a “complexity measure” which is a function from words to numbers, and require a bound on the number of mistakes in terms of the complexity. We also want the algorithm to be fast and use little space on words of low complexity (because such words should be compressible). In this talk, I will formalize these requirements and show that it is possible to meet them for several natural complexity measures coming from combinatorics on words, for which natural classes of sequences have slowly growing complexity. Two examples of such measures are left-to-right and right-to-left k-automaticity, so the corresponding prediction algorithms work well on k-automatic sequences. Another example is the size of the smallest straight-line program for a word, leading to an algorithm that works well for morphic and Sturmian sequences. Additional examples are complexity measures that were invented for this line of research, related to the “mix-automatic” sequences of Endrullis et al. Many open problems remain, both on the algorithms side and the combinatorics side.

- date: 2026-10-27
  speaker: Michael Coons
  speaker_url: https://mcoons-math.github.io/
  title: Correlations of the Thue-Morse Sequence
  video: https://youtu.be/EVVmWsjRUi8
  abstract: |
    We revisit the pair correlations of the Thue–Morse sequence with focus on asymptotic results on various means. In the first part of the talk, we will show that all higher-order correlations of the Thue–Morse sequence with general real weights are effectively determined by a single value of the balanced $2$-point correlation. As a consequence, we get that all odd-order correlations of the balanced Thue–Morse sequence vanish, and that, for any even $n$, the $n$-point correlations of the balanced Thue–Morse sequence have mean value zero, as do their absolute values, raised to an arbitrary positive power. We will then show how the correlations of the Thue–Morse sequence with general real weights can be derived from the balanced $2$-point correlations. In the second/last part of the talk, we will focus on understanding the growth of the sum of the absolute values of the autocorrelations. This is joint work with Michael Baake, Jan Mazac, Ari Pincus-Kazmar and Adam Stout.

